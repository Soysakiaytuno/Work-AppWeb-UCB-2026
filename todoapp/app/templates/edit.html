{% extends "base.html" %}

{% block content %}
<section class="card form-card">
    <h2>Edit Todo</h2>
    <form method="post" action="{{ url_for('todos.edit', todo_id=todo.id) }}">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ todo.title }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ todo.description or '' }}</textarea>
        </div>
        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="completed" {% if todo.completed %}checked{% endif %}>
                Completed
            </label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('todos.index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
