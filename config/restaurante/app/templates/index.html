<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Restaurante{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>
    <header class="mi-header">
        <h1>RESTAURANTE</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('views.pagina_inicio') }}">Inicio</a></li>
                <li><a href="{{ url_for('views.vista_usuarios') }}">Usuarios</a></li>
                <li><a href="{{ url_for('views.vista_usuario') }}">Usuario</a></li>
                <li><a href="{{ url_for('views.vista_mesas') }}">Mesas</a></li>

                <li><a href="{{ url_for('views.vista_login') }}">Login</a></li>

    </header>

        <p>ISW-233 - Web</p>

</html>
