# ==============================================================================
# NGINX CONFIGURATION (HTTP - DESAFÍO ACME Y PORTALES) - LA CARTA 2.0
# Dominios: carta.mijael.mooo.com y admin.mijael.mooo.com
# ==============================================================================

upstream flask_app {
    server web_flask:5000;
}

upstream django_app {
    server web_django:8000;
}

# ------------------------------------------------------------------------------
# 1. SUBDOMINIO FLASK: carta.mijael.mooo.com (y localhost)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name carta.mijael.mooo.com carta.localhost localhost 127.0.0.1;

    server_tokens off;
    client_max_body_size 10M;

    # Desafío HTTP de Certbot para emisión y renovación SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Estáticos de Flask servidos directamente desde disco
    location /static/ {
        alias /app/config/restaurante/app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Proxy hacia Flask (Gunicorn)
    location / {
        proxy_pass http://flask_app;

        # R5.3: Cabeceras del proxy obligatorias para ProxyFix y Auth0
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}

# ------------------------------------------------------------------------------
# 2. SUBDOMINIO DJANGO ADMIN: admin.mijael.mooo.com (y admin.localhost)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.mijael.mooo.com admin.localhost;

    server_tokens off;
    client_max_body_size 10M;

    # Desafío HTTP de Certbot para emisión y renovación SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # R5.5: Estáticos del admin servidos DIRECTAMENTE DESDE DISCO por Nginx
    location /static/ {
        alias /var/www/django_static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Redirección amigable: entrar a la raíz de admin lleva a /admin/
    location = / {
        return 301 /admin/;
    }

    # Proxy hacia Django Admin (Gunicorn)
    location / {
        proxy_pass http://django_app;

        # R5.3 y 4.C: Cabeceras para SECURE_PROXY_SSL_HEADER y CSRF_TRUSTED_ORIGINS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
