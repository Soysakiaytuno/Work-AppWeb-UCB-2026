# ==============================================================================
# NGINX PRODUCCIÓN (HTTPS / SSL ACTIVO) - LA CARTA 2.0 (ISW-233)
# Dominios: carta.mijael.mooo.com y admin.mijael.mooo.com
# Cumple R5: Redirección 80 -> 443, SSL Let's Encrypt en dos subdominios, estáticos desde disco
# ==============================================================================

upstream flask_app {
    server web_flask:5000;
}

upstream django_app {
    server web_django:8000;
}

# ------------------------------------------------------------------------------
# REDIRECCIÓN OBLIGATORIA HTTP (80) -> HTTPS (443) (R5.2)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name carta.mijael.mooo.com admin.mijael.mooo.com;

    server_tokens off;

    # Ruta para renovación de certificados de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 1. SUBDOMINIO FLASK CON HTTPS (carta.mijael.mooo.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name carta.mijael.mooo.com;

    server_tokens off;
    client_max_body_size 10M;

    # Certificados SSL de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/carta.mijael.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carta.mijael.mooo.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Estáticos de Flask servidos directamente desde disco
    location /static/ {
        alias /app/config/restaurante/app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Proxy hacia Flask (Gunicorn)
    location / {
        proxy_pass http://flask_app;

        # R5.3: Cabeceras para ProxyFix y Auth0 redirect_uri en HTTPS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}

# ------------------------------------------------------------------------------
# 2. SUBDOMINIO DJANGO ADMIN CON HTTPS (admin.mijael.mooo.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name admin.mijael.mooo.com;

    server_tokens off;
    client_max_body_size 10M;

    # Si se emitió un certificado por dominio o unificado:
    # Nota: si emitiste ambos con -d carta... -d admin..., ambos usan /live/carta.mijael.mooo.com/
    # Si emitiste por separado, usa /live/admin.mijael.mooo.com/
    ssl_certificate /etc/letsencrypt/live/admin.mijael.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mijael.mooo.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # R5.5: Estáticos del admin servidos DIRECTAMENTE DESDE DISCO por Nginx
    location /static/ {
        alias /var/www/django_static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Redirección amigable: entrar a la raíz lleva al panel admin
    location = / {
        return 301 /admin/;
    }

    # Proxy hacia Django Admin (Gunicorn)
    location / {
        proxy_pass http://django_app;

        # R5.3 y 4.C: Cabeceras para SECURE_PROXY_SSL_HEADER y CSRF_TRUSTED_ORIGINS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
